name: Publish approved prerelease
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-push build run for the current main commit
        required: true
        type: string
      tag:
        description: New prerelease tag (vX.Y.Z-rcN)
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release.py "$RUN_ID" "$RELEASE_TAG"
