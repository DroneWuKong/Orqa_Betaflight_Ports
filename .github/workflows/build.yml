name: Build and verify
on:
  push:
    branches: [main, "automation/**", "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-22.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - id: matrix
        run: |
          python -c 'import json,os; c=json.load(open("upstream.lock.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("targets="+json.dumps([t["id"] for t in c["targets"]])+"\n")'
  firmware:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.checks.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install build dependencies and verified compiler
        run: |
          python -m pip install -r requirements-build.txt
          python scripts/build.py toolchain "$RUNNER_TEMP/toolchain"
          python -c 'import json,os; c=json.load(open("upstream.lock.json")); open(os.environ["GITHUB_PATH"],"a").write(os.environ["RUNNER_TEMP"]+"/toolchain/"+c["toolchain"]["directory"]+"/bin\n")'
      - name: Prepare pinned upstream and reviewed patches
        run: python scripts/build.py prepare "$RUNNER_TEMP/source"
      - name: Build
        env:
          TARGET_ID: ${{ matrix.target }}
        run: python scripts/build.py build "$RUNNER_TEMP/source" --target "$TARGET_ID" --jobs 2
      - name: Verify artifacts and write provenance
        env:
          TARGET_ID: ${{ matrix.target }}
        run: python scripts/build.py collect "$RUNNER_TEMP/source" --target "$TARGET_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  gate:
    name: All firmware checks
    if: always()
    needs: [checks, firmware]
    runs-on: ubuntu-22.04
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          FIRMWARE: ${{ needs.firmware.result }}
        run: test "$CHECKS" = success && test "$FIRMWARE" = success
